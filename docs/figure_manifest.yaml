# figure_manifest.yaml
#
# Machine-readable manifest of the paper's figures. Drives the auto-generated
# PROVENANCE.md and FIGURES.md (run `python tools/gen_docs.py` after editing).
#
# The paper has 24 figures, 8 in the main text and 16 in the supplement. This
# manifest holds 27 entries. Two carry `retired-*` ids: their artwork was merged
# into the figures that absorbed it, the merged artwork is generated entirely in
# code, and their standalone files no longer exist, so the entries survive only
# as provenance and are excluded from the generated docs. One entry, R1, is an
# additional figure produced by the notebooks that is not numbered in the paper.
#
# cell_signature = a distinctive substring for locating the producer CODE cell.
#   Cell indices are CODE-cell indices (markdown cells excluded) and are
#   unstable across edits; prefer the signature string.
#
# verification.verdict legend:
#   BIT-EXACT / PIXEL-EXACT       -- byte/pixel identical (PDF/PNG metadata may differ)
#   PDF-METADATA-ONLY             -- only PDF CreationDate/ID/timestamp bytes differ
#   TIER-3-STATISTICAL            -- different RNG realization, statistically equivalent;
#                                    seeds in the current notebooks lock future
#                                    regenerations deterministic
#   ARTWORK-ONLY                  -- pure schematic artwork, no notebook producer
#   NON-DETERMINISTIC             -- residual run-to-run variance beyond seeding control
#
# Main-text figures are vector PDF. matplotlib embeds imshow output as a raster
# image inside the PDF rather than vectorizing pixels, so heatmap panels are
# hybrids with all text live; every PDF carries embedded subsetted CID TrueType
# fonts because ring/style.py sets pdf.fonttype 42. To compare regenerated PDFs,
# strip CreationDate/ModDate/ID first.
#
# figures/external/ holds the published grid-cell images from Hafting et al.
# (2005) that grid_cell_simulations panel A loads, used with permission from
# Springer Nature and excluded from the repository licence; see
# figures/external/README.md.
