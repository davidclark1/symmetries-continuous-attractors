    notes: >-
      The plotting cell shows the leading eigenvalues of the connectivity computed from
      generate_sample_data(N_samples=2500, N_period=1); no cache is read, and the sample data is
      seeded via the numpy RNG set at the top of the notebook. The spectrum is exactly 6-fold
      degenerate, and within each degenerate cluster the ordering returned by the eigenvalue
      solver is not guaranteed: it can change with the number of BLAS threads or between CPU and
      GPU execution, so a regenerated plot can show the same clear 6-fold degeneracy with
      individual points swapped within a cluster. This reordering is a non-deterministic
      artifact of the linear-algebra backend, not a change in the underlying spectrum.
