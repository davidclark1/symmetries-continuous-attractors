- figure: 8
  manuscript_file: figures/grid_cell_simulations.pdf
  title: "Grid-cell simulations from the disordered attractor"
  kind: composite
  producer:
    notebook: notebooks/grid_sims.ipynb
    output: grid_cell_simulations.pdf
    output_dir: figures/
    cell_signature: 'plt.savefig("../figures/grid_cell_simulations.pdf", bbox_inches="tight", dpi=450)  # SAVE_FIGURES-gated'
  input_caches:
    - data/grid_analysis_results.npz
    - data/eta_analysis_4.npz
    - figures/external/hafting2005_grid_ratemaps.png
    - data/gridness_hist_digitized.npz
  verification:
    verdict: BIT-EXACT
    f_fixes: [F7]
    notes: >-
      Panels a-b are external images, not model output: panel a is the Hafting et al. 2005 rat
      grid-cell rate maps, used with permission from Springer Nature, loaded from
      figures/external/hafting2005_grid_ratemaps.png, and panel b is a bar plot of the digitized
      Nayebi et al. 2021 / Mallory et al. 2021 grid-score histogram
      (data/gridness_hist_digitized.npz). Panels c-f are assembled in code from the simulation
      cache data/grid_analysis_results.npz, distinct from the similarly named
      data/analysis_results.npz used by another figure. The panel-d/e example cells are drawn
      using a numpy RNG seeded once at the top of the notebook, so the figure is deterministic
      given that seed; because each example cell is chosen as the one nearest a target grid
      score, a different seed or ridge value changes which cells are shown rather than the
      qualitative result. The displayed panel-d input-current maps are flipped in sign to
      positive skewness where needed, since the underlying generative process is sign-symmetric
      and only the positively skewed realization looks like a grid cell once rectified; this
      flip leaves the grid scores in panel c and the autocorrelations in panel e exactly
      unchanged. Panel f does not plot raw PCA axes: the leading PCA components are defined only
      up to sign and are mutually near-degenerate in eigenvalue, so which three define a
      standard PCA projection is arbitrary, and the panel instead uses a fixed torus display
      frame pinned to the two known toroidal phases, with axes labeled torus 1/2/3 rather than
      PC 1/2/3.
  composite_panels:
    - "a (experimental grid-cell responses, Hafting et al. 2005): published bitmap loaded from figures/external/hafting2005_grid_ratemaps.png, used with permission from Springer Nature"
    - "b (experimental grid-score distribution, Nayebi 2021 / Mallory 2021): histogram of data/experimental_gridness_scores.npy, digitized from the published figure"
    - "c-f (grid-score distributions, rate maps, autocorrelograms, torus PCA): grid_sims simulation content, rendered in the compose cell"
