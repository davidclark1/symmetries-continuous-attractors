- figure: "S4"
  file: figures/real_vs_surrogate_matrices.png
  title: "Real vs. surrogate connectivity matrices and their spectra"
  notebook: notebooks/weight_matrix_analyses.ipynb
  cell: 'plt.savefig("../figures/real_vs_surrogate_matrices.png"'
