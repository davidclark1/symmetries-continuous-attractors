- figure: "S11"
  file: figures/spurious_fixed_points.pdf
  title: "Searching for spurious fixed points in finite-N attractors"
  notebook: notebooks/spurious_fixed_points.ipynb
  cell: 'plt.savefig("../figures/spurious_fixed_points.pdf"'
  caches:
    - data/mouse_data/tc_data.npz
    - data/spurious_fixed_points.npz
  note: >-
    Two rows of panels at five matched noise levels, row a for the generative network and
    row b for the network derived from data. The data-derived network converges from every
    initial condition tested, including a per-neuron standard deviation of 1000, where states
    begin about 22 ring radii away and still end within 2e-4 of a ring radius of the
    manifold. Under unstructured initial conditions it also shows a preference for particular
    bump angles, which weakens as the initialization noise grows. Rebuilding the cache takes
    about two minutes.

