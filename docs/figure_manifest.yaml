- figure: "S5"
  file: figures/mexican_hat_origin.pdf
  title: "Origin of the Mexican-hat connectivity profile"
  notebook: notebooks/mexican_hat_and_asymmetry.ipynb
  cell: 'plt.savefig("../figures/mexican_hat_origin.pdf"'
  caches: []
  note: >-
    The plotting cell deconvolves normalized probability densities, stabilized by a hardcoded
    1e-6 constant. That constant is specific to this deconvolution and is not the ridge
    used elsewhere in the code. The tuning curves it works from are generated earlier in the
    notebook from a seeded generator.

- figure: "S6"
  file: figures/asymmetric_models.png
  title: "Asymmetric connectivity models"
  notebook: notebooks/mexican_hat_and_asymmetry.ipynb
  cell: 'plt.savefig("../figures/asymmetric_models.png"'
  caches: []
  note: >-
    This cell uses a ridge of 1e-6 rather than the 1e-8 used elsewhere, and the difference
    matters. The connectivity here comes from a rank-2 covariance, points on a
    two-dimensional ring, so the ridge acts on only two directions and enters twice through
    the inverse. At 1e-8 several near-null modes are admitted, and because the heatmaps
    autoscale, their large magnitudes wash out the structure the figure is about.

- figure: "S7"
  file: figures/double_normalization.pdf
  title: "Double normalization of tuning curves"
  notebook: notebooks/data_driven_reconstruction.ipynb
  cell: 'plt.savefig("../figures/double_normalization.pdf"'
  caches:
    - data/mouse_data/tc_data.npz
  note: >-
    The orange curve carries two transformations, not one: the sigma = 2 Gaussian smoothing
    of the input currents as well as the across-neuron normalization used to build the
    network. The neuron subsample it plots is seeded.

- figure: "S8"
  file: figures/pca_convergence.png
  title: "PCA convergence of the data-driven ring attractor"
  notebook: notebooks/data_driven_reconstruction.ipynb
  cell: 'plt.savefig("../figures/pca_convergence.png"'
  caches:
    - data/mouse_data/tc_data.npz
    - data/pc_convergence_grid.npz
  note: >-
    A sweep over the ridge strength lambda, with the operating value lambda = 1e-8.
  regen: >-
    Two things can move. The pcs_traj3_grid array in the cache is a stochastic realization,
    so rebuilding the cache redraws those trajectories, though the released cache reproduces
    the committed figure. And a different matplotlib release can reassign the categorical
    colour cycle, which changes the hue and drawing order of the trajectories without moving
    any of them.

- figure: "S9"
  file: figures/error_vs_regularization.pdf
  title: "Reconstruction error vs. regularization strength"
  notebook: notebooks/data_driven_reconstruction.ipynb
  cell: 'plt.savefig("../figures/error_vs_regularization.pdf")'
  caches:
    - data/mouse_data/tc_data.npz
    - data/pc_convergence_grid.npz
  note: >-
    A deterministic log-log plot of the mean squared flow error against lambda, swept from
    1e-12 to 1e-2 in decades. The operating value lambda = 1e-8 sits one grid step above the
    curve's true minimum near 3e-11, so it should not be read as minimizing the curve: the
    apparent upturn below 3e-11 is an artifact of finite-precision conditioning rather than a
    property of the flow. The figure is saved at full canvas width without a tight
    bounding box, so the surrounding whitespace is intentional.

