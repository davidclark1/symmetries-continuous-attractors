    output: model_vs_data.pdf
    output_dir: figures/
    cell_signature: 'plt.savefig("../figures/model_vs_data.pdf")  # SAVE_FIGURES-gated'
  input_caches:
    - data/analysis_results.npz
    - data/mouse_data/tc_data.npz
    - data/grid_search_results.npz
  verification:
    verdict: PDF-METADATA-ONLY
    f_fixes: [F13]
    notes: >-
      This composite is produced by one code cell that assembles the model/data statistics,
      mean/std profile, and generative-model-fitting panels via add_gridspec and saves
      figures/model_vs_data.pdf directly, gated by SAVE_FIGURES. The generative-process panels
