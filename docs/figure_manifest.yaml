    notes: >-
      Illustrative synthetic figure with no cached data. The connectivity uses the same rank-
      four geometry and the same seeded RNG (np.random.seed(42)) as Fig. S1, but the neuron
      loadings are drawn from a two-component Gaussian mixture so each neuron loads onto only
      one doublet; this makes every ring stable simultaneously and the attractor the full torus,
      rather than Fig. S1's union of rings. Initial conditions use independent uniform random
      angles in both doublets. Layout, kappa normalization, colormap, and axis limits are copied
      from Fig. S1 so the two figures read as a pair. The figure is deterministic given the
      seed, and the save is gated on SAVE_FIGURES.
  composite_panels: []

