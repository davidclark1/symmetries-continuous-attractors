- figure: 1
  manuscript_file: figures/classical_attractor_vs_data.pdf
  title: "Classical ring-attractor model and mouse HD tuning curves"
  kind: composite
  producer:
    notebook: notebooks/data_and_generative_model.ipynb
    output: classical_attractor_vs_data.pdf
    output_dir: figures/
    cell_signature: 'plt.savefig("../figures/classical_attractor_vs_data.pdf", dpi=400)'
  input_caches:
    - data/mouse_data/tc_data.npz
  verification:
    verdict: BIT-EXACT
    f_fixes: []
    notes: >-
      Panel b shows the classical ring-attractor connectivity kernel J(theta - theta') = J0 + J1
      cos(theta - theta') with J0 = 0, J1 = 1; the color limits are symmetric about zero so
      white marks the sign change, and there is no colorbar because the schematic carries no
      weight units. The whole figure, including the ring schematic (drawn by
      ring.plot.plot_ring_schematic) and panels a-g, is produced by a single notebook cell and
      reproduces as a bit-identical PNG when the cell is rerun. The top-band panels (a-d) are
      placed with explicit fig.add_axes calls rather than GridSpec, since GridSpec would give
      panels a and b different heights when b is square; panel a's y-window is pinned to the
      ring's outer diameter so the ring renders at the heatmap's size. Rendering the somata in
      the ring schematic requires interpolation='bilinear', overriding the global
      interpolation='none' default set in ring/style.py. The unit sampling in
      plot_data_tuning_curves is seeded by row index, so panel c is deterministic given the
      input order. Input cache tc_data.npz regenerates bit-exactly, and panel letters are
      lowercase (a-g), matching the captions.
  composite_panels:
    - "a (flow of the paper): ring.plot.plot_flow_schematic"
    - "b (ring-attractor schematic): ring.plot.plot_ring_schematic"
    - "c (circulant weight matrix, Mexican-hat J0 + J1 cos profile): ring.plot.plot_circulant_weights"
    - "d (translation-invariant tuning curves): ring.plot.plot_circulant_tuning_curves"
    - "e (per-mouse data tuning curves): ring.plot.plot_data_tuning_curves"
    - "f/g (mean + std profiles): ring.plot.plot_mean_std_profiles"
    - "composed and written by one notebook cell -> figures/classical_attractor_vs_data.pdf"

