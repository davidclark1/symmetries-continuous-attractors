  title: "Circular geometry, disordered embedding, and spectra of the optimal weights"
  kind: composite
  producer:
    notebook: notebooks/spectra.ipynb
    output: disordered_vs_circulant_spectra.pdf
    output_dir: figures/
    cell_signature: 'plt.savefig("../figures/disordered_vs_circulant_spectra.pdf", dpi=400)'
  input_caches: []
  verification:
    verdict: BIT-EXACT
    f_fixes: [F2]
    notes: >-
      J2 (the circulant-plus-noise matrix) is built by reseeding the RNG immediately before
      adding noise (np.random.seed(45)), and the whole figure is saved by the following code
      cell. The figure is fully synthetic: no cached array is read, and the tuning curves come
      from gen_tuning_curves_idealized. Reproducibility caveat: panel g's eigenvector/SVD panel
      can show a sign-flip in its rightmost subplot when regenerated on different hardware or
      BLAS builds, because singular vectors are only defined up to sign and the seed does not
      fix that. The spectra shown use ridge regularization lambda = 1e-8, computed as
      Gamma_x/(Gamma_phi + lambda); leading eigenvalues and the doublet/singlet structure are
      stable under this choice.
  composite_panels:
    - "ring.plot.plot_embedding_schematic -> panel A (ring-embedding schematic)"
    - "spectra.ipynb code-cell 10 -> panels B-H (matrices, spectrum, eigenvalue planes, eigenvector scatters)"

