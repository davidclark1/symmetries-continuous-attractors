- figure: "S15"
  file: figures/grid_cell_eigenvalues.pdf
  title: "Eigenvalue spectrum of the grid-cell connectivity"
  notebook: notebooks/grid_sims.ipynb
  cell: 'plt.savefig("../figures/grid_cell_eigenvalues.pdf"'
  caches: []
  note: >-
    The leading eigenvalues of the connectivity, computed in the notebook from sampled
    data.
  regen: >-
    The spectrum is exactly six-fold degenerate, and eigenvalue solvers do not promise any
    particular ordering inside a degenerate cluster. Changing the number of BLAS threads, or
    running on a GPU instead of a CPU, can therefore swap individual points within a cluster.
    The six-fold degeneracy the figure is about is unaffected.

- figure: "S16"
  file: figures/reservoir_rnn_dynamics.png
  title: "Attractor dynamics in a reservoir RNN"
  notebook: notebooks/reservoir_rnn.ipynb
  cell: 'plt.savefig("../figures/reservoir_rnn_dynamics.png", bbox_inches=''tight'', dpi=300)'
  caches: []
  note: >-
    One cell trains five reservoirs from scratch, which makes this the slowest figure here
    to regenerate. The reservoir weights, the input projection and the initial state are
    all drawn fresh from a seeded generator on each run.
  regen: >-
    Torch's CPU and GPU random-number streams differ even from the same seed, so a CPU run
    draws different reservoirs than a GPU run and about 10.6 percent of pixels change. The
    gain sweep, the convergent and non-convergent regimes, and the boundary between them all
    stay as they are. The committed image was made on a GPU, so match it on a GPU.
