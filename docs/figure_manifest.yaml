  title: "Mixture loadings: the attractor is the full torus"
  kind: direct
  producer:
    notebook: notebooks/weight_matrix_analyses.ipynb
    output: low_rank_mixture_torus.pdf
    output_dir: figures/
    cell_signature: 'plt.savefig("../figures/low_rank_mixture_torus.pdf"'
  input_caches: []
