site_name: Symmetries and Continuous Attractors in Disordered Neural Circuits
site_description: Code and documentation for "Symmetries and Continuous Attractors in Disordered Neural Circuits"
site_url: https://davidclark1.github.io/symmetries-continuous-attractors/
repo_url: https://github.com/davidclark1/symmetries-continuous-attractors
edit_uri: ""

exclude_docs: |
  internal/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Figures: figures.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
