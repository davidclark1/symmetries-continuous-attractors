# Builds the MkDocs site on every push to main and publishes it to the gh-pages
# branch, which GitHub Pages serves at
# https://davidclark1.github.io/symmetries-continuous-attractors/
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to the versions the site was last built and checked against, so a
      # later major release cannot change the output or fail the deploy without
      # anyone choosing it. mkdocs-material in particular has a 2.0 with
      # different licensing terms. Bump these deliberately, then rebuild locally
      # with `mkdocs build --strict` before pushing.
      - run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7" "mkdocstrings[python]==1.0.6"
      - run: pip install -e .
      # --strict so a broken link fails the build instead of publishing quietly.
      - run: mkdocs build --strict
      - run: mkdocs gh-deploy --force
